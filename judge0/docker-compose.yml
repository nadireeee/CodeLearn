x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:

  server:
    image: judge0/judge0:latest
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - ./box:/box
    ports:
      - "2358:2358"
    privileged: true
    security_opt:
      - seccomp=unconfined
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis123
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=postgres123
      - JUDGE0_ENABLE_WAIT_RESULT=true
      - JUDGE0_ENABLE_COMPILE_RESULT=true
      - JUDGE0_ENABLE_ALL_LANGUAGES=true
      - JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
      - JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
    <<: *default-logging
    restart: always

  worker:
    image: judge0/judge0:latest
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - ./box:/box
    privileged: true
    security_opt:
      - seccomp=unconfined
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis123
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=postgres123
      - JUDGE0_ENABLE_ALL_LANGUAGES=true
      - JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
      - JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
    <<: *default-logging
    restart: always

  db:
    image: postgres:16.2
    environment:
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=postgres123
    volumes:
      - data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: always

  redis:
    image: redis:7.2.4
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    environment:
      - REDIS_PASSWORD=redis123
    <<: *default-logging
    restart: always

volumes:
  data:
